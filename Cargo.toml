[package]
name = "lc-menubar"
version = "0.1.5"
edition = "2024"
description = "A macOS menu bar companion for Laravel Cloud: deployments, metrics, spend and actions"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem", "NSView", "NSImageView", "NSImage", "NSTextField", "NSControl", "NSFont", "NSColor", "NSResponder", "NSText", "NSAttributedString", "NSFontDescriptor", "NSCell", "NSImageCell", "NSGraphics", "NSAppearance", "NSApplication", "NSBox", "NSParagraphStyle", "NSBitmapImageRep", "NSImageRep", "NSTextAttachment", "NSSegmentedControl", "NSSegmentedCell", "NSActionCell", "NSLayoutConstraint", "NSAlert", "NSPasteboard", "NSRunningApplication", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSGeometry", "NSAttributedString", "NSDictionary", "NSArray", "NSObject"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tao = "0.37.2"
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "rt-multi-thread"] }
tray-icon = "0.26.1"
wry = "0.57.2"
